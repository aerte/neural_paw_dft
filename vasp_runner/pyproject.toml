description = "VASP SCF-seeding experiments: SAD / converged / ML-predicted charge-density initialisations on MP and GNoME structures"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ase>=3.28.0",
    "lz4>=4.4.5",
    "mp-api>=0.46.1",
    "pandas>=3.0.3",
    "pymatgen>=2026.5.4",
    "python-dotenv>=1.0",
    "wandb>=0.27.0",
]
