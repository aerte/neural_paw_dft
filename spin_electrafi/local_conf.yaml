wandb: False
debug: False
full_inference_val: True
full_inference_test: True
infer_chunk_size: 100000

# SPIN
spin_type: total_diff

# ROTATIONS
rotate_train: False,
rotate_val: True,
rotate_test: True,

rotate_train_center: "origin"   # or "cop", "com"
rotate_eval_center: "origin"

rotate_eval_deterministic: True
log_cov_stats: True
norm_mode: total

pw_grid: [128, 128, 128] # just for initializing the fft grid
pw_norm: backward
signed_weights: softsign

fft_set_dc_to_electrons: False

data_split: "mpfull2025_local"

electra_type: single
plot_gaus_pos: True
backbone: escaip
escaip_cfg_path: "./model/escaip/escaip_config_local.yaml"

project_name: ELECTRA-PBC_SPIN_TEST
save_memory: False
max_time: '00:48:00:00'
max_epochs: 1000

crystal: True
pbc: True
wrap: True
weight_decay: 0.00

loss_type: "spectral"
cutoff: 20
master_units: 1000
initial_lr: 0.00008
final_lr: 0.00008
clip_grad: False
gradient_clip_value: 0.00
sigma_scale_min: 0.01         # lower bound on Gaussian width scale
sigma_scale_max: 25.0         # upper bound on Gaussian width scale
weight_mag_max: 50.0          # cap on per-Gaussian |weight| before electron renorm
negative_contributions: True
gaus_per_electrons: 50
lr_dec_every: 1
lr_gamma: 0.98
dens_path: ./MP_FULL_2025

precision: float

relu: False
seed: 505
cluster: False
hpc: False

data_split_path: ./data_splits/

hpc_base_path: ./
cluster_base_path: ./
# Base path for prediction outputs (CHGCARs, deltas, gaussian positions, outliers); model_dir is separate.
output_base_path: .
pred_dens_path_val: pred_dens/validation/
density_delta_path_val: density_deltas/validation
pred_dens_path_test: pred_dens/test/
density_delta_path_test: density_deltas/test
gaus_pos_path_val: gaussian_positions/validation/
gaus_pos_path_test: gaussian_positions/test/
gaus_pos_outlier_path: outliers/
visualize_every: 50
model_dir: trained_models

ood_eval: False
ood_names: ["gnome_ecd"]
ood_paths: ["/path/to/gnome_ecd"]

load_model: False
load_model_path:

# TRAINING
optimizer: adamw
amsgrad: True
fused: False
n_epochs: 1000
eval_every: 1
construct_test_cd: False
construct_val_cd: True
save_model: False
