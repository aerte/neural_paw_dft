name: tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
          pip check
      # Weights-gated tests download from the Hub when a token with access to the weights repo is set.
      - name: Test
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          NDI_TEST_DOWNLOAD_WEIGHTS: ${{ secrets.HF_TOKEN != '' && '1' || '0' }}
          NDI_WEIGHTS_DIR: ${{ runner.temp }}/weights
        run: pytest tests/ -q
